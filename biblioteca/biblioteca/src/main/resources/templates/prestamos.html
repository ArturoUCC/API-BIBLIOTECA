<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Préstamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .form-control:focus, .form-select:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        @media (max-width: 767px) { .table { font-size: .86rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand brand-mark" th:href="@{/vista/libros}">BIBLIOTECA</a>
            <div>
                <a class="nav-link d-inline text-white-50" th:href="@{/vista/libros}">Libros</a>
                <a class="nav-link d-inline text-white-50 ms-3" th:href="@{/vista/clientes}">Clientes</a>
                <a class="nav-link d-inline text-white ms-3" th:href="@{/vista/prestamos}">Préstamos</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
            <div>
                <p class="text-uppercase small mb-1 text-secondary">Administración</p>
                <h1 class="h2 mb-0">Préstamos</h1>
            </div>
            <span class="badge text-bg-light border" th:text="${#lists.size(prestamos)} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <!-- Formulario de registro -->
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Registrar préstamo</h2>
                    <form th:action="@{/vista/prestamos/guardar}" th:object="${prestamo}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label class="form-label" for="cliente">Cliente</label>
                            <select id="cliente" class="form-select" th:field="*{cliente.id}" required>
                                <option value="">-- Seleccionar cliente --</option>
                                <option th:each="c : ${clientes}"
                                        th:value="${c.id}"
                                        th:text="${c.nombre} + ' ' + ${c.apellidos}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="libro">Libro</label>
                            <select id="libro" class="form-select" th:field="*{libro.isbn}" required>
                                <option value="">-- Seleccionar libro --</option>
                                <option th:each="l : ${libros}"
                                        th:value="${l.isbn}"
                                        th:text="${l.titulo}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="fechaPrestamo">Fecha de préstamo</label>
                            <input id="fechaPrestamo" type="date" class="form-control" th:field="*{fechaPrestamo}" th:min="${hoy}" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="fechaDevolucion">Fecha de devolución</label>
                            <input id="fechaDevolucion" type="date" class="form-control" th:field="*{fechaDevolucion}" th:min="${hoy}" required>
                        </div>

                        <button class="btn btn-primary w-100" type="submit">Guardar préstamo</button>
                    </form>
                </div>
            </section>

            <!-- Listado -->
            <section class="col-lg-8">
                <div class="panel p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 class="h5 mb-0">Listado de préstamos</h2>
                        <input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar cliente o libro">
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaPrestamos">
                            <thead>
                                <tr>
                                    <th>ID</th><th>Cliente</th><th>Libro</th><th>Préstamo</th><th>Devolución</th><th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${prestamos}">
                                    <td th:text="${p.id}"></td>
                                    <td th:text="${p.cliente != null ? p.cliente.nombre + ' ' + p.cliente.apellidos : 'N/A'}"></td>
                                    <td th:text="${p.libro != null ? p.libro.titulo : 'N/A'}"></td>
                                    <td th:text="${p.fechaPrestamo}"></td>
                                    <td th:text="${p.fechaDevolucion}"></td>
                                    <td class="text-end text-nowrap">
                                        <a class="btn btn-outline-danger btn-sm"
                                           th:href="@{/vista/prestamos/eliminar/{id}(id=${p.id})}"
                                           onclick="return confirm('¿Eliminar este préstamo?')">Eliminar</a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(prestamos)}">
                                    <td colspan="6" class="text-center text-secondary py-4">No hay préstamos registrados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaPrestamos tbody tr').forEach(function (row) {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });

        const inputPrestamo = document.getElementById('fechaPrestamo');
const inputDevolucion = document.getElementById('fechaDevolucion');
inputPrestamo.addEventListener('change', function () {
    inputDevolucion.min = this.value;
    if (inputDevolucion.value && inputDevolucion.value < this.value) {
        inputDevolucion.value = '';
    }
});
    </script>
</body>
</html>
